{% extends 'hrms/layout.html' %}
{% load static %}
{% block title %}Add Location | JBL{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-8 offset-lg-2">
            <div class="d-flex justify-content-between align-items-center my-3">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="{% url 'hrms:admin_dashboard' %}">Dashboard</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Add Location</li>
                </ol>
                <a href="{% url 'hrms:location_list' %}" class="btn btn-primary">
                    <i class="fas fa-list"></i> View Locations
                </a>
            </div>
            
            <div class="card shadow-sm p-4">
                <h4 class="mb-4">Add New Location</h4>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary btn-block">Add Location</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
