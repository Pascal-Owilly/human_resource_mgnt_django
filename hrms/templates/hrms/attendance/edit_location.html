{% extends 'hrms/layout.html' %}
{% load static %}
{% block title %}Edit Location | JBL{% endblock title %}

{% block content %}
<div class="container mt-5">
    <ol class="breadcrumb bg-light p-2 rounded">
        <li class="breadcrumb-item"><a href="{% url 'hrms:admin_dashboard' %}">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="{% url 'hrms:location_list' %}">Locations</a></li>
        <li class="breadcrumb-item active" aria-current="page">Edit Location</li>
    </ol>
    
    <div class="row justify-content-center mt-4">
        <div class="col-lg-10">
            <div class="card shadow-sm p-4">
                <h4 class="mb-4">Edit Location</h4>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary btn-block">Update Location</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
