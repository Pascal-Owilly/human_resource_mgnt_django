<!-- templates/contract_management/preview_contract.html -->
{% extends 'hrms/layout.html' %}

{% block title %}Preview Contract{% endblock %}

{% block content %}
<style>
    /* Global styles for the entire application */
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    margin: 0;
    padding: 0;
}

header {
    background-color: #5c6bc0;
    padding: 10px 20px;
}

header nav ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    gap: 20px;
}

header nav ul li a {
    color: white;
    text-decoration: none;
    font-size: 16px;
}

main {
    padding: 20px;
}

footer {
    background-color: #333;
    color: white;
    text-align: center;
    padding: 10px;
}

.contract-preview-container {
    width: 80%;
    max-width: 900px;
    margin: 50px auto;
    padding: 20px;
    background-color: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

h2 {
    color: #333;
    font-size: 24px;
    margin-bottom: 20px;
}

.contract-preview-form {
    display: flex;
    flex-direction: column;
}

.form-group {
    margin-bottom: 20px;
}

.contract-content-label {
    font-size: 16px;
    color: #333;
    margin-bottom: 8px;
    font-weight: bold;
}

.contract-content-textarea {
    width: 100%;
    padding: 12px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background-color: #f9f9f9;
    resize: vertical;
}

.submit-btn {
    padding: 10px 20px;
    background-color: #5c6bc0;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.submit-btn:hover {
    background-color: #3f51b5;
}

@media (max-width: 768px) {
    .contract-preview-container {
        width: 90%;
        padding: 15px;
    }
}

</style>
    <div class="contract-preview-container">
        <h2>Contract Preview</h2>
        <p><strong>Template: </strong>{{ template.name }}</p>
        
        <form method="POST" class="contract-preview-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="contract_content" class="contract-content-label">Contract Content:</label>
                <textarea id="contract_content" name="contract_content" rows="15" class="contract-content-textarea" required>{{ contract_content }}</textarea>
            </div>
            
            <input type="hidden" name="user_id" value="{{ user.id }}">
            
            <div class="form-actions">
                <button type="submit" class="submit-btn">Create Contract</button>
            </div>
        </form>
    </div>
{% endblock %}
