<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Contract</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <style>
        .signature-pad {
            border: 2px solid #007bff;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        #signature-preview-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        .btn-secondary {
            margin-top: 10px;
        }

        .form-label {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">Sign Contract: {{ contract.title }}</h2>

        {% if messages %}
            <div class="alert alert-info">
                <ul class="messages">
                    {% for message in messages %}
                        <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}

        <form method="POST" id="sign-contract-form" class="border p-4 rounded bg-light shadow">
            {% csrf_token %}
            
            <div class="form-group mb-4">
                <label for="signature" class="form-label">Draw your signature:</label>
                <canvas id="signature-pad" class="signature-pad" width="400" height="200"></canvas>
                <input type="hidden" name="signature_data" id="signature-data">
                <button type="button" id="clear-signature" class="btn btn-secondary mt-2">Clear</button>
            </div>

            <div class="form-group mb-4">
                <label for="initials" class="form-label">Initials:</label>
                <input type="text" name="initials" id="initials" class="form-control" value="{{ contract.user_initials }}">
            </div>

            <div class="d-flex justify-content-between">
                <button type="button" id="preview-signature" class="btn btn-info">Preview Signature</button>
                <button type="submit" class="btn btn-primary">Sign Contract</button>
            </div>
        </form>

        <!-- Signature Preview Div -->
        <div id="signature-preview-container" class="mt-4" style="display:none;">
            <h3>Signature Preview</h3>
            <img id="signature-preview" src="" alt="Signature Preview" class="img-fluid" />
            <button type="button" class="btn btn-secondary mt-2" onclick="closePreview()">Close</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('signature-pad');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        canvas.addEventListener('mousedown', () => { drawing = true; });
        canvas.addEventListener('mouseup', () => { drawing = false; ctx.beginPath(); });
        canvas.addEventListener('mousemove', draw);
        document.getElementById('clear-signature').addEventListener('click', clearSignature);
        document.getElementById('preview-signature').addEventListener('click', previewSignature);

        function draw(event) {
            if (!drawing) return;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000';
            ctx.lineTo(event.clientX - canvas.offsetLeft, event.clientY - canvas.offsetTop);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(event.clientX - canvas.offsetLeft, event.clientY - canvas.offsetTop);
        }

        function clearSignature() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('signature-data').value = '';
        }

        function previewSignature() {
            const dataURL = canvas.toDataURL();
            document.getElementById('signature-preview').src = dataURL;
            document.getElementById('signature-data').value = dataURL;
            document.getElementById('signature-preview-container').style.display = 'block';
        }

        function closePreview() {
            document.getElementById('signature-preview-container').style.display = 'none';
        }
    </script>
</body>
</html>
