{% extends 'hrms/layout.html' %}
{% load static %}
{% block title %} Bulk Upload | JBL {% endblock title %}
{% block content %}

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        color: #333;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 90%;
        max-width: 500px;
        margin: 30px auto;
        padding: 20px;
        background-color: #fff;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
    }

    h1 {
        font-size: 24px;
        margin-bottom: 20px;
        color: #444;
        text-align: center;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    label {
        font-weight: bold;
        color: #555;
    }

    input[type="file"] {
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background-color: #f9f9f9;
    }

    input[type="file"]:focus {
        outline: none;
        border-color: #4CAF50;
        background-color: #eef7ee;
    }

    button {
        padding: 10px 20px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        align-self: flex-start;
    }

    button:hover {
        background-color: #45a049;
    }
</style>

<div class="container">
    <h1>Bulk Upload CSV</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="file">Upload CSV:</label>
        <input type="file" name="file" id="file" required>
        <button type="submit">Upload</button>
    </form>
</div>

{% endblock %}
