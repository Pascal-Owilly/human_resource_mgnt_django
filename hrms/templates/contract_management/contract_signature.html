<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div id="signature-pad"></div>
    <button type="submit">Sign Contract</button>
</form>
{% if contract.signature %}
    <img src="data:image/png;base64,{{ contract.signature|safe }}" alt="Signature">
{% else %}
    <p>No signature available.</p>
{% endif %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-signature/1.2.0/js-signature.min.js"></script>
<script>
    // Initialize signature pad
    var signaturePad = new SignaturePad(document.getElementById('signature-pad'));

    // Update hidden field on submit
    document.querySelector('form').addEventListener('submit', function () {
        document.querySelector('input[name="signature"]').value = signaturePad.toDataURL();
    });
</script>
