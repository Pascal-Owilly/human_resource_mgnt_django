<!-- templates/emails/contract_notification.html -->
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
        }
        h2 {
            color: #4CAF50;
        }
        p {
            font-size: 16px;
        }
        .button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Hello {{ recipient_name }},</h2>
        <p>You have a pending contract to review and sign.</p>
        <p>
            Please click the button below to review and sign the contract:
        </p>
        <a href="{{ contract_link }}" class="button">Review Contract</a>
        <p>Best regards,<br>Jawabu Best Limited</p>
    </div>
</body>
</html>
