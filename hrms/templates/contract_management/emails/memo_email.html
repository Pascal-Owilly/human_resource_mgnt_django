<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        .email-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 6px 6px 0 0;
            text-align: center;
        }
        .memo-details {
            margin: 20px 0;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 20px;
        }
        a {
            color: #4CAF50;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h2>Memo Notification</h2>
        </div>
        <p>New memo from <strong>{{ sender.first_name }} {{ sender.last_name }}</strong>. Below are the details:</p>
        <div class="memo-details">
            <h3>{{ memo.title }}</h3>
            <p>{{ memo.content }}</p>
        </div>
        <p>Best regards,<br>JBL Team</p>
        <div class="footer">
            <p>This is an automated message. Please do not reply to this email.</p>
        </div>
    </div>
</body>
</html>
